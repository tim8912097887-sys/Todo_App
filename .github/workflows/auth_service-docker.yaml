name: Auth_Service-Docker-Build-and-Push

on:
    push:
        tags:
            - 'v*'
        branches:
            - main
concurrency:
    group: ${{ github.workflow }}
    cancel-in-progress: false
env:
    NODE_ENV: test
    PORT: 3002
    LOG_LEVEL: debug
    CENTRAL_LOG_TOKEN: ${{ secrets.CENTRAL_LOG_TOKEN || 'rURY92XXbmu4jxSetfGsisdf' }}
    DATABASE_URL: ${{ secrets.AUTH_SERVICE_DATABASE_URL || 'postgresql://postgres:password@localhost:5433/auth_service' }}
    TOKEN_SECRET: ${{ secrets.TOKEN_SECRET || 'e7ead07d8910318b24f3b5d5360b3956' }}
    TOKEN_EXPIRES_IN: 7d
    JWT_ISSUER: http://localhost:3002
    JWT_AUDIENCE: http://localhost:5173
    RABBITMQ_URL: ${{ secrets.RABBITMQ_URL || 'amqp://admin:password@localhost:5672' }}
    REDIS_URL: ${{ secrets.REDIS_URL || 'redis://:password@localhost:6379' }}
jobs:
    lint-and-test:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: ./auth_service
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Setup Pnpm
              uses: pnpm/action-setup@v3
              with:
                  version: 10.26.1
                  standalone: true
            - name: Set up Node.js 20
              uses: actions/setup-node@v3
              with:
                  node-version: 20
            - name: Install dependencies
              run: pnpm install
            - name: Lint
              run: pnpm lint
            - name: Test
              run: pnpm test
    push-docker-image:
        needs: lint-and-test
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: ./auth_service
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Extract Docker metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ secrets.DOCKERHUB_USERNAME }}/todo_app-auth_service
                  tags: |
                      # EX: 1.0.0  
                      type=semver,pattern={{version}}
                      # EX: 1.0
                      type=semver,pattern={{major}}.{{minor}}
                      # EX: 1
                      type=semver,pattern={{major}}
                      type=raw,value=latest,enable={{is_default_branch}}
            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}
            - name: Build and push
              uses: docker/build-push-action@v5
              with:
                  context: ./auth_service
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
