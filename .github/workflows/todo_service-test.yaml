name: CI-todo_service-Test
on:
    push:
        branches:
            - main
            - dev
            - feat/**
            - fix/**
    pull_request:
        branches:
            - main
            - dev
concurrency:
    group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}
env:
    NODE_ENV: test
    PORT: 3001
    LOG_LEVEL: debug
    CENTRAL_LOG_TOKEN: ${{ secrets.CENTRAL_LOG_TOKEN || 'rURY92XXbmu4jxSetfGsidfg' }}
    DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://postgres:password@localhost:5432/todo_service' }}
jobs:
    todo_service-test:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: ./todo_service
        strategy:
            matrix:
                node-version: [20, 22]
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Setup Pnpm
              uses: pnpm/action-setup@v3
              with:
                  version: 10.26.1
                  standalone: true
            - name: Set up Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v3
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: pnpm
                  cache-dependency-path: './todo_service/pnpm-lock.yaml'
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Run tests
              run: pnpm run test
