services:
    rabbitmq:
        image: rabbitmq:3-management-alpine
        container_name: rabbitmq
        ports:
            - 5672:5672 # Main RabbitMQ port (AMQP)
            - 15672:15672 # Management UI port
        environment:
            RABBITMQ_DEFAULT_USER: admin
            RABBITMQ_DEFAULT_PASS: password
        volumes:
            - rabbitmq_data:/var/lib/rabbitmq
        networks:
            - todo_app_network
        healthcheck:
            test: ['CMD', 'rabbitmq-diagnostics', 'check_port_connectivity']
            interval: 5s
            timeout: 5s
            retries: 5
    todo_service_db:
        image: postgres:14-alpine
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: password
            POSTGRES_DB: todo_service
        ports:
            - 5432:5432
        networks:
            - todo_app_network
        volumes:
            - todo_service_db_data:/var/lib/postgresql/data
    auth_service_db:
        image: postgres:14-alpine
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: password
            POSTGRES_DB: auth_service
        ports:
            - 5433:5432
        volumes:
            - auth_service_db_data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U postgres -d auth_service']
            interval: 5s
            timeout: 5s
            retries: 5
            start_period: 10s
        networks:
            - todo_app_network
    # Add a migration service for the auth_service to run migrations before starting the main service
    auth_migration:
        build: ./auth_service
        # Overwrite the default start command with your migration script
        command: node db/migrate.js
        env_file:
            - ./auth_service/.env.dev
        depends_on:
            auth_service_db:
                condition: service_healthy
        networks:
            - todo_app_network
    auth_service:
        build: ./auth_service
        ports:
            - 3002:3002
        env_file:
            - ./auth_service/.env.dev
        networks:
            - todo_app_network
        depends_on:
            auth_service_db:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
            auth_migration:
                condition: service_completed_successfully
        restart: always
    email_service:
        build: ./email_service
        ports:
            - 3003:3003
        env_file:
            - ./email_service/.env.dev
        networks:
            - todo_app_network
        depends_on:
            rabbitmq:
                condition: service_healthy
        restart: always
volumes:
    todo_service_db_data:
    auth_service_db_data:
    rabbitmq_data:
networks:
    todo_app_network:
        driver: bridge
